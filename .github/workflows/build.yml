name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q KiaSportage-Launcher.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;36.0.0"

      - name: Build
        working-directory: KiaSportage-Launcher
        env:
          BUILD_TOOLS: "36.0.0"
        run: sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: KiaLauncher-${{ github.sha }}
          path: KiaSportage-Launcher/build/KiaLauncher.apk
          if-no-files-found: error
